<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>Petit Quiz Futsuken | 仏検の1問1答</title>
<meta name="description" content="仏検の筆記問題クイズ">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">
<meta property="og:url" content="https://kamataryo.github.io/petit-quiz-futsuken/">
<meta property="og:title" content="Petit Quiz Futsuken | 仏検1問1答">
<meta property="og:description" content="仏検の筆記問題クイズ。">
<meta property="og:image" content="https://kamataryo.github.io/petit-quiz-futsuken/assets/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Bodoni+Moda:opsz,wght@6..96,400..600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
  :root {
    --paper: #FCFCFA;
    --ink: #1A2440;
    --ink-soft: #616A88;
    --rule: #D9D4E6;
    --ok: #1E7A5B;
    --part: #9A6200; /* 地の色と 4.5:1 以上 (判定の行は 16px) */
    --ng: #C4453C;
    --focus: #3B57C4;
    --display: "Bodoni Moda", "Hiragino Mincho ProN", serif;
    --body: "Archivo", "Zen Kaku Gothic New", system-ui, "Hiragino Sans", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #11131C;
      --ink: #D6D8E4;
      --ink-soft: #9098B4;
      --rule: #34364A;
      --ok: #55C296;
      --part: #E8B04B;
      --ng: #F07C72;
      --focus: #8FA3FF;
    }
    /* 暗い背景だと明るい文字がにじみ (ハレーション)、Bodoni の極細線は opsz を下げても読みにくい。
       暗いときだけ線の太さが均一なセリフにする。Apple は New York、ほかは Georgia */
    :root { --display: ui-serif, Georgia, "Hiragino Mincho ProN", serif; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  /* 寸法はすべて rem/em なので、根元を上げればスマホでまとめて大きくなる。
     画面幅に比例させ、幅 430px (iPhone Pro Max) で 25px (= 125% を Safari で 2 段拡大した大きさ)。小さい画面でも 125% は下回らない。
     もっと大きくしたいときは vw と上限の % を上げる */
  @media (max-width: 34rem) { html { font-size: clamp(125%, 5.8vw, 156.25%); } }
  body {
    margin: 0;
    min-height: 100dvh;
    padding: 1rem 1rem 5rem; /* 下は #actions に隠れない分 */
    display: flex;
    flex-direction: column;
    gap: 2rem;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--body);
    -webkit-text-size-adjust: 100%;
  }
  header, main, footer { width: 100%; max-width: 44rem; margin-inline: auto; }

  /* 見出しと成績。成績は「最後に答えた結果」を問題ごとに数えたもの。下の帯は全問に対する割合 */
  header { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: .9rem 1rem; }
  h1 { font: italic 500 1.3rem var(--display); margin: 0; }
  #stats { display: flex; gap: 1.25rem; margin: 0; }
  #stats div { display: flex; flex-direction: column; align-items: flex-end; gap: .1rem; }
  #stats dt { font-size: .7rem; color: var(--ink-soft); white-space: nowrap; }
  #stats dt::before {
    content: "";
    display: inline-block;
    width: .5rem;
    height: .5rem;
    margin-right: .3rem;
    border-radius: 50%;
    background: var(--c, transparent);
  }
  #stats dd { margin: 0; font: 600 1.4rem/1 var(--body); font-variant-numeric: tabular-nums; color: var(--c, var(--ink)); }
  #stats .total { padding-left: 1.25rem; border-left: 1px solid var(--rule); }
  #stats .total dt::before { display: none; }
  .ok { --c: var(--ok); }
  .part { --c: var(--part); }
  .ng { --c: var(--ng); }
  #bar { grid-column: 1 / -1; display: flex; height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
  #bar i { background: var(--c); transition: width .3s; }
  @media (max-width: 34rem) {
    header { grid-template-columns: 1fr; }
    /* 間隔は space-between に任せ、すき間の下限は詰める。幅 320px でもはみ出さない */
    #stats { justify-content: space-between; gap: .5rem; }
    #stats .total { padding-left: .5rem; }
  }

  /* タップでキーボードを出すために click を拾っているので、iOS が main 全体を灰色に光らせないようにする */
  main { display: flex; flex-direction: column; gap: 1.1rem; -webkit-tap-highlight-color: transparent; }
  main > :empty { display: none; }
  main p { margin: 0; }
  #type { font-size: 1rem; line-height: 1.6; color: var(--ink-soft); }
  /* 復習モード中は指示文の頭に印を出す */
  [data-mode="missed"] #type::before {
    content: "復習";
    margin-right: .5rem;
    padding: .05rem .5rem;
    border-radius: 999px;
    background: var(--part);
    color: var(--paper);
    font-weight: 600;
  }
  #hint { font-size: 1.1rem; color: var(--ink-soft); }

  /* 問題文。動詞の書き換えは A と B を同じ大きさで並べる */
  #sentences { display: flex; flex-direction: column; gap: .5rem; font: 500 clamp(1.7rem, 6.5vw, 2.5rem)/1.6 var(--display); }
  .line { display: flex; gap: .6em; align-items: baseline; margin: 0; }
  .line > span { white-space: pre-line; min-width: 0; }
  .tag { font: 600 .5em var(--body); color: var(--ink-soft); }
  .paren { color: var(--ink-soft); }

  /* 長文。空欄は #answer と同じ見た目で、採点したら空欄ごとに色を付ける */
  #passage { margin: 0; font: 500 1.25rem/2 var(--display); white-space: pre-line; }
  /* 会話は話し手と台詞の2列。台詞が長いときは台詞の列の中で折り返す */
  #passage.dialog { display: grid; grid-template-columns: max-content 1fr; gap: .15rem 1em; }
  #passage .who { color: var(--ink-soft); }
  #passage [data-r="correct"] { color: var(--ok); border-color: var(--ok); }
  #passage [data-r="partial"] { color: var(--part); border-color: var(--part); }
  #passage [data-r="wrong"] { color: var(--ng); border-color: var(--ng); text-decoration: line-through; }

  /* かっこの中に直接書く。幅は中身に合わせて伸びる (未対応のブラウザは固定幅) */
  #answer, #passage input {
    field-sizing: content;
    min-width: 3em;
    max-width: calc(100% - .3em); /* 長く打っても行からはみ出さず、欄の中で流れる。.3em は左右の margin */
    margin: 0 .15em;
    padding: 0 .15em;
    font: inherit; /* 16px 未満だと iOS がズームする。文の大きさをそのまま使う */
    color: var(--ink);
    background: none;
    border: 0;
    border-bottom: 2px solid var(--rule);
    border-radius: 0;
    outline: none;
  }
  /* 書き終えた欄は、フォーカスを外したら (答えたあとも) 中身の幅まで縮める。書いている間と空の欄は min-width を残す */
  #answer.filled:is(:not(:focus), :read-only), #passage input.filled:is(:not(:focus), :read-only) { min-width: 0; }
  @supports not (field-sizing: content) { #answer, #passage input { width: 6em; } }
  #answer:focus, #passage input:focus { border-color: var(--focus); }
  /* 頭文字のヒントは答えに要る情報なので、大きい文字で 3:1 を下回らない濃さにする */
  #answer::placeholder, #passage input::placeholder { color: var(--ink-soft); opacity: .8; }
  [data-result="correct"] #answer { color: var(--ok); border-color: var(--ok); }
  [data-result="partial"] #answer { color: var(--part); border-color: var(--part); }
  [data-result="wrong"] #answer { color: var(--ng); border-color: var(--ng); text-decoration: line-through; }
  #fix, .fix { color: var(--ok); }
  #fix:not(:empty), .fix { margin-right: .15em; }

  #choices { display: flex; flex-wrap: wrap; gap: .5rem; }
  /* 長文の候補。フォーカスした空欄の下に app.js が置く */
  #opts { position: absolute; z-index: 1; display: flex; flex-direction: column; gap: .3rem; }
  #opts:empty, main[data-result] ~ #opts { display: none; }
  #choices button, #opts button, #claims button {
    font: 1.15rem var(--display);
    color: inherit;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 999px;
    padding: .25rem .95rem;
    cursor: pointer;
  }
  #choices [aria-pressed="true"], #opts [aria-pressed="true"], #claims [aria-pressed="true"] { border-color: var(--focus); color: var(--focus); }
  #opts button { padding: .2rem .8rem; text-align: left; white-space: nowrap; background: color-mix(in srgb, var(--focus) 18%, var(--paper)); border-color: color-mix(in srgb, var(--focus) 45%, var(--paper)); } /* 下の文の上に重なるので、地と違う色で塗りつぶす */
  #choices .answer { border-color: var(--ok); color: var(--ok); }

  /* 内容一致の文。文が短ければ ○ × を同じ行の右に、入らなければ次の行の右に置く */
  #claims { list-style: none; margin: 1.5rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .9rem; font: 500 1.2rem/1.6 var(--display); }
  #claims:empty { display: none; }
  #claims li { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem; }
  #claims li > :first-child { flex: 1 1 15rem; }
  .ox { display: flex; gap: .4rem; margin-left: auto; }
  #claims button { font-family: var(--body); min-width: 3.2rem; }
  #claims [aria-pressed="true"] { background: color-mix(in srgb, currentColor 12%, transparent); }
  #claims .answer, #claims [data-r="correct"] [aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
  #claims [data-r="wrong"] [aria-pressed="true"] { border-color: var(--ng); color: var(--ng); text-decoration: line-through; }

  #result { font-weight: 600; }
  [data-result="correct"] #result { color: var(--ok); }
  [data-result="partial"] #result { color: var(--part); }
  [data-result="wrong"] #result { color: var(--ng); }
  #ja, #note { color: var(--ink-soft); line-height: 1.7; }
  #hint, #ja, #note { white-space: pre-line; } /* 長文の注・全訳・解説は改行で区切る */

  #empty, #done { width: 100%; max-width: 44rem; margin: 3rem auto 0; text-align: center; font-size: 1.2rem; }
  #empty small, #done small { display: block; margin-top: .6rem; font-size: .8rem; color: var(--ink-soft); }

  footer { margin-top: auto; display: flex; flex-wrap: wrap; gap: .5rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
  footer button {
    font: 1rem var(--body);
    color: var(--ink);
    background: none;
    border: 1px solid var(--rule);
    border-radius: .5rem;
    padding: .6rem 1rem;
    cursor: pointer;
  }
  footer button:disabled { opacity: .4; cursor: default; }
  #reset { margin-left: auto; color: var(--ink-soft); }

  /* Enter の代わりのボタン。画面の下端に固定し、キーボードが出たら app.js でその上まで持ち上げる。
     答え合わせの前は「回答する」、あとは「次にすすむ」だけを出す */
  #actions { position: fixed; left: 0; right: 0; bottom: 0; padding: .6rem 1rem; background: var(--paper); border-top: 1px solid var(--rule); }
  #actions > button { display: block; width: 100%; max-width: 44rem; margin: 0 auto; padding: .85rem; font: 600 1.15rem var(--body); color: var(--paper); background: var(--ink); border: 0; border-radius: .5rem; cursor: pointer; }
  main[data-result] ~ #actions #submit, main:not([data-result]) ~ #actions #next, main[hidden] ~ #actions { display: none; }
  /* 押せないときはタップを下の #actions に通す。そこで mousedown を止めているので、入力欄からフォーカスが外れずキーボードも閉じない */
  #actions > button:disabled { opacity: .4; cursor: default; pointer-events: none; }


  /* マウスで押せるものに乗ったら少し濃くする。押せないもの (答えたあとの語群、無効のボタン) と選択中のものは変えない */
  @media (hover: hover) {
    main:not([data-result]) #choices button:not([aria-pressed="true"]):hover,
    main:not([data-result]) #claims li:not([data-r]) button:not([aria-pressed="true"]):hover,
    footer button:not(:disabled):hover { border-color: var(--ink-soft); }
    #actions > button:not(:disabled):hover { opacity: .85; }
  }
</style>

<header>
  <h1>Petit Quiz Futsuken</h1>
  <dl id="stats" aria-live="polite">
    <div class="ok"><dt>正解</dt><dd id="n-correct">0</dd></div>
    <div class="part"><dt>部分正解</dt><dd id="n-partial">0</dd></div>
    <div class="ng"><dt>不正解</dt><dd id="n-wrong">0</dd></div>
    <div class="total"><dt>全問</dt><dd id="n-total">0</dd></div>
  </dl>
  <div id="bar" aria-hidden="true"><i id="bar-correct" class="ok"></i><i id="bar-partial" class="part"></i><i id="bar-wrong" class="ng"></i></div>
</header>
<main>
  <p id="type"></p>
  <p id="hint"></p>
  <div id="sentences" lang="fr">
    <p id="a-line" class="line"><b class="tag">A</b><span id="a"></span></p>
    <form id="form">
      <p id="passage" hidden></p>
      <ol id="claims"></ol>
      <p id="b-line" class="line"><b id="tag-b" class="tag">B</b><span><span id="before"></span><span class="paren">(</span><input id="answer" lang="fr" aria-label="答え" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go"><span id="fix"></span><span class="paren">)</span><span id="after"></span></span></p>
    </form>
  </div>
  <!-- 判定と解説は文のすぐ下に出す。語群の下だとスマホでは画面の外になる -->
  <p id="result" aria-live="polite"></p>
  <p id="ja"></p>
  <p id="note"></p>
  <div id="choices" lang="fr"></div>
</main>
<p id="empty" hidden>間違えた問題はありません。<small>「全問から出題する」で全問にもどれます。</small></p>
<p id="done" hidden>全問解き終わりました。<small>「間違えた問題のみ」で復習するか、「記録をリセット」で最初から解き直せます。</small></p>
<div id="opts" lang="fr"></div>
<div id="actions">
  <button id="submit" form="form">回答する</button>
  <button id="next" form="form">次にすすむ</button>
</div>
<footer>
  <button id="mode" type="button"></button>
  <button id="open-keys" type="button">アクサンの入力方法</button>
  <button id="reset" type="button">記録をリセット</button>
</footer>
<script type="module" src="app.js"></script>
